name: image

on:
  push:
    branches: [develop]

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build-and-push-image:
    name: Build & Push Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the package version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if tags=$(gh api "/orgs/wavix/packages/container/testgrid/versions" --paginate --jq '.[].metadata.container.tags[]' 2>err.txt); then
            if printf '%s\n' "$tags" | grep -qFx "${{ steps.version.outputs.version }}"; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q "HTTP 404" err.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat err.txt >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wavix/testgrid
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.published.outputs.exists == 'false' }}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
